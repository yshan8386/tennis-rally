name: Deploy to tennis.ysj.life

on:
  push:
    branches:
      - main
      - codex/initial-source

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/tennis-rally
            git pull origin ${{ github.ref_name }}
            npm install
            npm run build
            pm2 restart tennis-rally
