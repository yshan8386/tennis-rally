<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tennis Club App — IA &amp; 화면 기획</title>
<style>
:root{
  --bg:#fff;--bg2:#f5f4f0;--bg3:#eeede9;
  --t1:#1a1a19;--t2:#5f5e5a;--t3:#888780;
  --b1:rgba(0,0,0,.4);--b2:rgba(0,0,0,.25);--b3:rgba(0,0,0,.12);
  --blue:#185FA5;--blue-l:#E6F1FB;--blue-d:#0C447C;
  --teal:#0F6E56;--teal-l:#E1F5EE;--teal-d:#085041;
  --coral:#993C1D;--coral-l:#FAECE7;
  --purple:#3C3489;
  --green-l:#EAF3DE;--green-d:#27500A;
  --amber-l:#FAEEDA;--amber-d:#633806;
  --red-l:#FCEBEB;--red-d:#A32D2D;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1c1c1a;--bg2:#252523;--bg3:#2e2e2b;
    --t1:#e8e7e3;--t2:#9c9a92;--t3:#6e6d67;
    --b1:rgba(255,255,255,.4);--b2:rgba(255,255,255,.25);--b3:rgba(255,255,255,.1);
    --blue:#378ADD;--blue-l:#0C447C;--blue-d:#85B7EB;
    --teal:#1D9E75;--teal-l:#085041;--teal-d:#9FE1CB;
    --coral:#D85A30;--coral-l:#712B13;
    --purple:#7F77DD;
    --green-l:#173404;--green-d:#C0DD97;
    --amber-l:#412402;--amber-d:#FAC775;
    --red-l:#501313;--red-d:#F09595;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t1);font-size:14px;line-height:1.5}

/* Tab nav */
.topnav{display:flex;gap:4px;padding:16px 16px 0;border-bottom:1px solid var(--b3)}
.tnav-btn{padding:8px 18px;border-radius:8px 8px 0 0;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--t2);font-size:13px;font-weight:500;cursor:pointer;margin-bottom:-1px}
.tnav-btn.on{color:var(--blue);border-bottom-color:var(--blue);background:var(--bg2)}
.tab-panel{display:none;padding:20px 16px}
.tab-panel.on{display:block}

/* ── IA ── */
.ia-auth{display:flex;justify-content:center;gap:10px;margin-bottom:6px}
.auth-pill{padding:6px 16px;border-radius:16px;border:1px solid var(--b2);font-size:12px;color:var(--t2);display:flex;align-items:center;gap:6px}
.ia-lbl{text-align:center;font-size:11px;color:var(--t3);margin-bottom:5px}
.ia-arrow{text-align:center;color:var(--b2);margin:3px 0 8px;font-size:18px}
.ia-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:780px;margin:0 auto}
.ia-col{display:flex;flex-direction:column}
.ia-hdr{padding:9px 6px;text-align:center;font-size:12px;font-weight:600;color:#fff;border-radius:6px 6px 0 0}
.ia-stem{width:1px;height:10px;margin:0 auto;background:var(--b2)}
.ia-grp{margin-top:4px}
.ia-l2{padding:7px 8px;font-size:11px;font-weight:600;color:var(--t1);background:var(--bg2);border:1px solid var(--b2);border-radius:4px}
.ia-l2.sub{border-radius:4px 4px 0 0;border-bottom:none}
.ia-subs{border:1px solid var(--b2);border-top:none;border-radius:0 0 4px 4px;overflow:hidden}
.ia-l3{padding:5px 8px 5px 15px;font-size:11px;color:var(--t2);background:var(--bg);border-top:1px solid var(--b3)}
.ia-l3:first-child{border-top:none}
.ia-l3::before{content:"· ";color:var(--t3)}
.ia-badge{display:inline-block;font-size:9px;padding:1px 5px;border-radius:3px;margin-left:4px;vertical-align:1px}
.ia-legend{display:flex;gap:14px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.ia-leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t3)}
.ia-leg-box{width:12px;height:12px;border-radius:2px;flex-shrink:0}

/* ── Wireframes ── */
.wf-wrap{display:flex;gap:16px;align-items:flex-start}
.wf-nav{width:156px;flex-shrink:0}
.wf-nav-title{font-size:11px;color:var(--t3);margin-bottom:8px}
.wf-nbtn{display:flex;align-items:center;gap:7px;width:100%;padding:7px 10px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;font-size:12px;color:var(--t2);margin-bottom:2px;text-align:left}
.wf-nbtn:hover{background:var(--bg2)}
.wf-nbtn.on{background:var(--bg2);border-color:var(--b2);color:var(--t1);font-weight:600}
.wf-num{min-width:17px;height:17px;border-radius:4px;background:var(--bg3);font-size:10px;display:flex;align-items:center;justify-content:center;color:var(--t3)}
.wf-nbtn.on .wf-num{background:var(--blue);color:#fff}
.wf-frame-area{flex:1;display:flex;justify-content:center}
.wf-phone{width:272px;border:1.5px solid var(--b1);border-radius:28px;overflow:hidden;background:var(--bg)}
.wf-statusbar{display:flex;justify-content:space-between;padding:8px 16px 5px;font-size:10px;color:var(--t3)}
.wf-body{height:490px;overflow:hidden}
.wf-screen{min-height:490px;display:flex;flex-direction:column}
.wf-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--b3);font-size:13px;font-weight:600;flex-shrink:0}
.wf-back{font-size:20px;color:var(--t2);line-height:1;cursor:pointer}
.wf-main{flex:1;overflow:hidden}
.wf-bnav{display:flex;border-top:1px solid var(--b3);flex-shrink:0}
.wf-ntab{flex:1;padding:8px 2px 10px;text-align:center;font-size:9px;color:var(--t3)}
.wf-ntab.on{color:var(--blue);font-weight:600}
.wf-ntab-line{width:14px;height:2px;background:var(--blue);border-radius:1px;margin:0 auto 3px;opacity:0}
.wf-ntab.on .wf-ntab-line{opacity:1}
.wf-tabs{display:flex;border-bottom:1px solid var(--b3)}
.wf-tabt{padding:8px 7px;font-size:11px;color:var(--t2);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.wf-tabt.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.wf-card{margin:8px 12px;padding:10px 12px;border:1px solid var(--b3);border-radius:8px}
.wf-sec{padding:8px 14px 4px;font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.3px}
.wf-li{padding:9px 14px;border-bottom:1px solid var(--b3);font-size:12px}
.wf-tag{display:inline-block;font-size:9px;padding:2px 6px;border-radius:3px}
.wf-avatar{width:26px;height:26px;border-radius:50%;background:var(--bg2);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--t2);flex-shrink:0}
.wf-inp{width:100%;padding:7px 10px;border:1px solid var(--b2);border-radius:6px;font-size:11px;background:var(--bg2);color:var(--t1)}
.wf-btn-p{padding:7px 14px;border-radius:6px;background:var(--blue);color:#fff;font-size:11px;font-weight:600;border:none;cursor:pointer}
.wf-btn-s{padding:7px 14px;border-radius:6px;background:var(--bg2);color:var(--t2);font-size:11px;border:1px solid var(--b2);cursor:pointer}
</style>
</head>
<body>

<div class="topnav">
  <button class="tnav-btn on" onclick="showTab('ia',this)">IA 구조</button>
  <button class="tnav-btn" onclick="showTab('wire',this)">화면 기획</button>
</div>

<!-- ── IA 패널 ── -->
<div id="tab-ia" class="tab-panel on">

        </div>
      </div>
      <div class="ia-grp"><div class="ia-l2">클럽원 목록</div></div>
      <div class="ia-grp"><div class="ia-l2">클럽 정보</div></div>
    </div>

    <div class="ia-col">
      <div class="ia-hdr" style="background:var(--purple)">마이페이지</div>
      <div class="ia-stem"></div>

      <div class="ia-grp">
        <div class="ia-l2 sub">소속 클럽</div>
        <div class="ia-subs">
          <div class="ia-l3">클럽 추가 신청</div>
          <div class="ia-l3">승인 대기 현황</div>
        </div>
      </div>

      <div class="ia-grp"><div class="ia-l2">참가 이력</div></div>

    </div>
  </div>

  <div class="ia-legend">
    <div class="ia-leg"><div class="ia-leg-box" style="background:var(--bg2);border:1px solid var(--b2)"></div>L2 메인 화면</div>
    <div class="ia-leg"><div class="ia-leg-box" style="background:var(--bg);border:1px solid var(--b3)"></div>L3 세부 화면</div>
    <div class="ia-leg"><span class="ia-badge" style="background:var(--teal-l);color:var(--teal-d);font-size:9px">NEW</span>v0.2 신규</div>
  </div>
</div>

<!-- ── 화면 기획 패널 ── -->
<div id="tab-wire" class="tab-panel">
  <div class="wf-wrap">
    <div class="wf-nav">
      <div class="wf-nav-title">화면 목록</div>
      <div id="wf-list"></div>
    </div>
    <div class="wf-frame-area">
      <div class="wf-phone">
        <div class="wf-statusbar"><span>9:41</span><span>||| 100%</span></div>
        <div class="wf-body" id="wf-body">
          <div style="padding:20px 16px;font-size:12px;color:var(--t3);">로딩 중...</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function showTab(id, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('on'));
  document.getElementById('tab-' + id).classList.add('on');
  document.querySelectorAll('.tnav-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
}

const TABS = ['홈','ATP/WTA','클럽','마이'];
function bnav(a) {
  return '<div class="wf-bnav">' + TABS.map((t,i) =>
    '<div class="wf-ntab' + (i===a?' on':'') + '">' +
    '<div class="wf-ntab-line"></div>' + t + '</div>'
  ).join('') + '</div>';
}
function vbar() {
  return '<div style="display:flex;gap:3px;height:6px;border-radius:3px;overflow:hidden;margin:5px 0;">' +
    '<div style="flex:8;background:#0F6E56;"></div>' +
    '<div style="flex:3;background:#EF9F27;"></div>' +
    '<div style="flex:1;background:#E24B4A;"></div></div>';
}
function tag(text, bg, tc) {
  return '<span class="wf-tag" style="background:' + bg + ';color:' + tc + ';">' + text + '</span>';
}
